<title>Valdir Silveira | Cartão profissional</title>
<style>
:root{color-scheme:light;--ink:#202437;--muted:#687186;--line:#e5e7ef;--brand:#2010f5;--brand-deep:#2113dd;--bg:#f6f7fb;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:40px 18px}
a{color:inherit}
.card{width:min(100%,450px);background:#fff;border:1px solid #e8eaf0;border-radius:18px;box-shadow:0 18px 55px rgba(33,42,73,.065);overflow:hidden}
.accent{height:5px;background:linear-gradient(90deg,#1711ed,#5b5cfb)}
.inner{padding:34px 32px 29px}
.brandline{display:flex;align-items:center;justify-content:center;min-height:76px}
.brand{width:100%;display:flex;align-items:center;justify-content:center}
.brand img{display:block;width:100%;max-width:385px;height:auto;object-fit:contain}
.rule{height:1px;background:var(--line);margin:24px 0 30px}
h1{font-size:32px;line-height:1.12;letter-spacing:-.055em;font-weight:720;margin:0 0 10px}
.role{font-size:16px;color:#4f5668;margin:0 0 7px}
.org{font-size:13px;color:var(--brand-deep);font-weight:700;margin:0 0 28px}
.actions{display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:14px 18px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:700;transition:background-color .15s ease,transform .15s ease}
.btn:active{transform:scale(.99)}
.btn-primary{background:var(--brand-deep);color:white}.btn-primary:hover{background:#1711b3}
.btn-outline{background:#fff;color:#353849;border:1px solid #d9dbe4}.btn-outline:hover{background:#f8f8fb}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.section-title{font-size:10px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#8990a0;margin:30px 0 10px}
.detail{display:flex;align-items:center;gap:12px;color:#444d63;text-decoration:none;font-size:14px;padding:11px 0;overflow-wrap:anywhere;min-width:0}
.detail svg{width:18px;height:18px;flex:0 0 auto;stroke:#8b93a7;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.detail span{min-width:0;overflow-wrap:anywhere}
.detail:hover{color:var(--brand-deep)}
.footer{padding:16px 32px 20px;background:#fcfcfe;border-top:1px solid #eff0f5;text-align:center;color:#858b99;font-size:11px;line-height:1.6}
.footer a{text-decoration:none;color:#656c80}
@media(max-width:380px){.inner{padding:28px 23px 26px}.footer{padding-left:20px;padding-right:20px}h1{font-size:29px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main class="card">
  <div class="accent"></div>
  <div class="inner">
    <header class="brandline">
      <div class="brand">
        <img src="logo-irede.png" alt="iRede — Instituto de Gestão, Redes Tecnológicas e Energias" width="678" height="149">
      </div>
    </header>
    <div class="rule"></div>
    <h1>Valdir Silveira</h1>
    <p class="role">Gerente de Projetos</p>
    <p class="org">iRede</p>
    <nav class="actions" aria-label="Ações do cartão">
      <a class="btn btn-primary" href="./valdir_silveira.vcf" download="Valdir_Silveira.vcf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>Salvar contato</a>
      <a class="btn btn-outline" href="https://www.linkedin.com/in/valdirsilveira/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10v7M8 7v.1M12 17v-7m0 3a3 3 0 0 1 6 0v4"/></svg>Ver LinkedIn</a>
      <a class="btn btn-outline" href="https://irede.org.br/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a16 16 0 0 1 0 18M12 3a16 16 0 0 0 0 18"/></svg>Conhecer o iRede</a>
    </nav>
    <p class="section-title">Contato direto</p>
    <a class="detail" href="mailto:valdir.silveira@irede.org.br"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>valdir.silveira@irede.org.br</span></a>
    <a class="detail" href="tel:+5585997352028"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2c0 8.8 7.2 16 16 16a2 2 0 0 0 2-2v-3l-5-2-2 2a16 16 0 0 1-6-6l2-2-2-5Z"/></svg><span>+55 (85) 99735-2028</span></a>
  </div>
  <footer class="footer">Cartão digital profissional · <a href="https://irede.org.br/" target="_blank" rel="noopener noreferrer">irede.org.br</a></footer>
</main>
</body>
</html>
